<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>السبحة</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-page="rosary">
    <div class="top-controls">
        <button class="icon-btn" type="button" aria-label="تبديل الوضع الليلي" onclick="toggleTheme()"><i class="fas fa-sun theme-icon"></i></button>
        <a href="index.html" class="icon-btn"><i class="fas fa-home"></i></a>
    </div>

    <header class="header"><h1>السبحة الإلكترونية</h1></header>

    <div class="rosary-container">
        <div id="rosary-display">0</div>
        <button type="button" id="rosary-btn" class="counter-btn" aria-label="زيادة عداد السبحة">
            <i class="fas fa-fingerprint" style="font-size: 4rem; opacity: 0.5;"></i>
        </button>
        <button id="reset-rosary" type="button">تصفير</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
